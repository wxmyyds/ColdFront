name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # Accept licenses so AGP can install compileSdk 37 if it is missing from the runner.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Run debug and release unit tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Run full Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Build debug & release APK
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # Normal artifact uploads resume as soon as the temporary workaround is disabled.
      - name: Upload validation reports
        if: ${{ always() && vars.CI_ARTIFACT_STORAGE_DELAY_WORKAROUND != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ColdFront-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: ${{ vars.CI_ARTIFACT_STORAGE_DELAY_WORKAROUND != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ColdFront-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # This build has no signing Secrets for pull requests and forks, so the APK is unsigned.
      # Upload any APK filename in the release output directory.
      - name: Upload release APK (unsigned)
        if: ${{ vars.CI_ARTIFACT_STORAGE_DELAY_WORKAROUND != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ColdFront-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  publish-latest-build:
    name: Publish rolling latest build
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        vars.CI_ARTIFACT_STORAGE_DELAY_WORKAROUND == 'true' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rolling-latest-release
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Rebuild APKs for the rolling release
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Update latest CI build release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ci-latest
        shell: bash
        run: |
          set -euo pipefail

          cp app/build/outputs/apk/debug/app-debug.apk ColdFront-debug.apk
          shopt -s nullglob
          release_apks=(app/build/outputs/apk/release/*.apk)
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#release_apks[@]}"
            printf '%s\n' "${release_apks[@]}"
            exit 1
          fi
          cp "${release_apks[0]}" ColdFront-release-unsigned.apk

          notes_file="$RUNNER_TEMP/ci-latest-release-notes.md"
          cat > "$notes_file" <<EOF
          # Latest successful main build

          - Commit: [\`${GITHUB_SHA:0:12}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - This rolling prerelease is replaced after each successful push build on \`main\`.
          - The release APK is unsigned; use the versioned stable releases for installable signed builds.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Replace assets first; then move the lightweight tag to the tested commit.
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \\
              ColdFront-debug.apk ColdFront-release-unsigned.apk --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \\
              --title "Latest successful CI build" --notes-file "$notes_file" --prerelease
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \\
              -F "sha=${GITHUB_SHA}" -F force=true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \\
              --target "$GITHUB_SHA" --title "Latest successful CI build" \\
              --notes-file "$notes_file" --prerelease \\
              ColdFront-debug.apk ColdFront-release-unsigned.apk
          fi

  remove-temporary-release:
    name: Remove temporary rolling release
    needs: build
    if: >-
      ${{
        vars.CI_ARTIFACT_STORAGE_DELAY_WORKAROUND != 'true' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rolling-latest-release
      cancel-in-progress: false
    steps:
      - name: Delete temporary rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ci-latest
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "No temporary rolling release exists."
          fi
