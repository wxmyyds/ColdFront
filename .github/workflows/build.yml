name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # compileSdk 37 可能不在 runner 预装 SDK 里，先接受许可以便 AGP 自动补装
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Run debug and release unit tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Run full Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Build debug & release APK
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ColdFront-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ColdFront-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 校验构建不注入签名密钥（PR / fork 拿不到 Secrets），产出未签名 APK；
      # 路径用通配符，日后若此流程也接上签名不会因文件名变化而失败
      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: ColdFront-release-unsigned
          path: app/build/outputs/apk/release/*.apk
