name: Release Prerelease

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要发布的分支或提交 SHA'
        required: true
        type: string
        default: 'feat/jacket6-pro-support'
      version:
        description: '预发布版本号，例如 1.0.2-rc.1'
        required: true
        type: string

run-name: Pre-release ${{ inputs.version }} from ${{ inputs.source_ref }}

permissions:
  contents: write

concurrency:
  group: release-versioning
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build and publish signed prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolve prerelease version
        id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! git check-ref-format --branch "$SOURCE_REF" >/dev/null 2>&1 &&
            ! [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref 必须是有效分支名或完整 40 位 commit SHA"
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || {
            echo "::error::版本号必须为 X.Y.Z-rc.N，例如 1.0.2-rc.1"
            exit 1
          }
          git fetch origin +refs/heads/release:refs/remotes/origin/release 2>/dev/null || true
          git fetch origin +refs/heads/prerelease:refs/remotes/origin/prerelease 2>/dev/null || true
          git fetch --tags origin
          if git rev-parse origin/release >/dev/null 2>&1; then
            STABLE_VERSION=$(git show origin/release:app/build.gradle.kts | grep -oP 'versionName\s*=\s*"\K[0-9.]+' || true)
            CODE=$(git show origin/release:app/build.gradle.kts | grep -oP 'versionCode\s*=\s*\K[0-9]+' || true)
          else
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            STABLE_VERSION=$(git show origin/main:app/build.gradle.kts | grep -oP 'versionName\s*=\s*"\K[0-9.]+' || true)
            CODE=$(git show origin/main:app/build.gradle.kts | grep -oP 'versionCode\s*=\s*\K[0-9]+' || true)
          fi
          [[ "$STABLE_VERSION" && "$CODE" ]] || {
            echo "::error::无法解析最近正式版的版本号或 versionCode"
            exit 1
          }
          PRE_CODE=$(git show origin/prerelease:app/build.gradle.kts 2>/dev/null | grep -oP 'versionCode\s*=\s*\K[0-9]+' || true)
          if [[ "$PRE_CODE" =~ ^[0-9]+$ ]] && (( PRE_CODE > CODE )); then CODE="$PRE_CODE"; fi
          BASE_VERSION="${VERSION%-rc.*}"
          [[ "$BASE_VERSION" != "$STABLE_VERSION" ]] || {
            echo "::error::预发布基础版本必须高于最近正式版 v$STABLE_VERSION"
            exit 1
          }
          if ! printf '%s\n%s\n' "$STABLE_VERSION" "$BASE_VERSION" | sort -V | tail -1 | grep -Fxq "$BASE_VERSION"; then
            echo "::error::预发布基础版本 v$BASE_VERSION 不高于最近正式版 v$STABLE_VERSION"
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG 已存在"
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse HEAD)
          NEW_CODE=$((CODE + 1))
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW_CODE/" app/build.gradle.kts
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sourceSha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "sourceRef=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintRelease --stacktrace

      - name: Materialize release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COLDFRONT_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/coldfront-release.jks
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::仓库缺少 Secret COLDFRONT_KEYSTORE_BASE64，无法签名预发布"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Assemble signed release APK
        shell: bash
        env:
          COLDFRONT_KEYSTORE_FILE: ${{ runner.temp }}/coldfront-release.jks
          COLDFRONT_KEYSTORE_PASSWORD: ${{ secrets.COLDFRONT_KEYSTORE_PASSWORD }}
          COLDFRONT_KEY_ALIAS: ${{ secrets.COLDFRONT_KEY_ALIAS }}
          COLDFRONT_KEY_PASSWORD: ${{ secrets.COLDFRONT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk \
            || { echo "::error::未生成已签名 APK"; ls -l app/build/outputs/apk/release/; exit 1; }

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -d "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Record prerelease version and tag
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B prerelease
          git add app/build.gradle.kts
          git commit -m "chore(prerelease): v${VERSION}"
          PRE_SHA=$(git rev-parse HEAD)
          git push --force origin prerelease
          git tag -a "$TAG" -m "Prerelease $TAG"
          git push origin "$TAG"
          echo "prereleaseSha=$PRE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SOURCE_REF: ${{ steps.resolve.outputs.sourceRef }}
          SOURCE_SHA: ${{ steps.resolve.outputs.sourceSha }}
          TARGET_SHA: ${{ steps.tag.outputs.prereleaseSha }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk ColdFront.apk
          cat > /tmp/prerelease-notes.md <<EOF
          # ColdFront v${VERSION} (预发布)

          - 来源：\`${SOURCE_REF}\`（\`${SOURCE_SHA}\`）
          - 此版本用于验证分支新功能；6 Pro 硬件尚未实机验证。
          EOF
          gh release create "$TAG" \
            --title "ColdFront v${VERSION} (预发布)" \
            --target "$TARGET_SHA" \
            --prerelease \
            --notes-file /tmp/prerelease-notes.md \
            ColdFront.apk
