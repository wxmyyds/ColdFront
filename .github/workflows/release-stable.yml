name: Release Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版版本号 X.Y.Z，须高于最近一次发布（release 分支）的版本'
        required: false
        type: string
        default: ''

run-name: Release ${{ inputs.version != '' && format('v{0}', inputs.version) || 'current version' }}

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    name: Sync release branch, tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # compileSdk 37 可能不在 runner 预装 SDK 里，先接受许可以便 AGP 自动补装
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 发布分支模型：main 保持干净（版本号不动），版本号只落在 release 分支。
      # 每次发布 = main 最新代码 + 版本号升级，同步到 release 分支后打 tag。
      # 基准版本取 release 分支（最近一次发布）上的值，versionCode 才能单调递增；
      # 首次发布（尚无 release 分支）退化为 main 上的版本号。
      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # 注意：grep 无匹配时退出 1，在 set -e 下会静默终结整步（本步骤曾因漏写文件参数而零输出失败），
          # 故一律用 || true 兜住，改由下方显式校验并报出可读错误。
          if git rev-parse origin/release >/dev/null 2>&1; then
            CUR=$(git show origin/release:app/build.gradle.kts | grep -oP 'versionName\s*=\s*"\K[0-9.]+' || true)
            CODE=$(git show origin/release:app/build.gradle.kts | grep -oP 'versionCode\s*=\s*\K[0-9]+' || true)
            echo "最近发布（release 分支）：v$CUR（versionCode $CODE）"
          else
            CUR=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts || true)
            CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts || true)
            echo "首次发布（尚无 release 分支）：main 版本 v$CUR（versionCode $CODE）"
          fi
          if [ -z "$CUR" ] || [ -z "$CODE" ]; then
            echo "::error::无法解析版本号（CUR='$CUR' CODE='$CODE'），检查 app/build.gradle.kts 的 versionName/versionCode"
            exit 1
          fi
          INPUT="${{ inputs.version }}"
          if [ -z "$INPUT" ]; then
            # 留空仅在首次发布时可用（对应 main 上的初始版本号）
            if git rev-parse origin/release >/dev/null 2>&1; then
              echo "请填写新版本号：最近一次发布为 v$CUR，该版本已打 tag，不能重复发布"
              exit 1
            fi
            echo "留空：使用 main 当前版本 v$CUR（首次发布）"
            VERSION="$CUR"; NEW_CODE="$CODE"; BUMPED=false
          else
            [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本号格式错误：$INPUT（需 X.Y.Z）"; exit 1; }
            # 新版本必须高于最近发布版本（sort -V 语义比较）
            if ! printf '%s\n%s\n' "$CUR" "$INPUT" | sort -V | tail -1 | grep -Fxq "$INPUT"; then
              echo "新版本 $INPUT 不高于最近发布 $CUR，拒绝发布"
              exit 1
            fi
            NEW_CODE=$((CODE + 1))
            sed -i "s/versionName = \".*\"/versionName = \"$INPUT\"/" app/build.gradle.kts
            sed -i "s/versionCode = [0-9]*/versionCode = $NEW_CODE/" app/build.gradle.kts
            VERSION="$INPUT"; BUMPED=true
            echo "已写入 versionName=$VERSION, versionCode=$NEW_CODE"
            git diff -- app/build.gradle.kts
          fi
          # tag 去重，防重复发布
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} 已存在，拒绝重复发布"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"

      - name: Compile debug and release sources
        run: ./gradlew compileDebugKotlin compileReleaseKotlin --stacktrace

      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintRelease --stacktrace

      # 正式发布必须带签名：密钥库只存在于 Secrets，不落仓库。缺密钥时直接失败，
      # 避免静默发出未签名（实际上无法安装）的 APK。
      - name: Materialize release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COLDFRONT_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/coldfront-release.jks
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::仓库缺少 Secret COLDFRONT_KEYSTORE_BASE64，无法签名发布"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "密钥库已就绪：$KEYSTORE_PATH（$(stat -c%s "$KEYSTORE_PATH") 字节）"

      - name: Assemble release APK
        shell: bash
        env:
          COLDFRONT_KEYSTORE_FILE: ${{ runner.temp }}/coldfront-release.jks
          COLDFRONT_KEYSTORE_PASSWORD: ${{ secrets.COLDFRONT_KEYSTORE_PASSWORD }}
          COLDFRONT_KEY_ALIAS: ${{ secrets.COLDFRONT_KEY_ALIAS }}
          COLDFRONT_KEY_PASSWORD: ${{ secrets.COLDFRONT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace
          # 签名生效时 AGP 产出 app-release.apk；未签名会以 -unsigned 结尾，此处直接卡住
          test -f app/build/outputs/apk/release/app-release.apk \
            || { echo "::error::未生成已签名 APK"; ls -l app/build/outputs/apk/release/; exit 1; }

      # 发布前校对签名：确认 APK 真的带证书且是预期的那把
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -d "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          echo "使用 $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Sync release branch, commit version and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release 分支仅由本工作流维护：重置到 main 最新代码，保留版本号改动后提交
          git checkout -B release
          if [ "${{ steps.resolve.outputs.bumped }}" = 'true' ]; then
            git add app/build.gradle.kts
            git commit -m "chore(release): v${VERSION}"
          else
            echo "首次发布：无版本号改动，直接用 main 当前提交"
          fi
          git push --force origin release
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          echo "release 分支已同步（main + v${VERSION}），tag v${VERSION} 已推送"

      - name: Generate Chinese release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          NOTES="/tmp/coldfront-notes-${VERSION}.md"
          # 上一个正式版 tag（不含本次刚打的 tag）；首个正式版时为空
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV"..HEAD --no-merges --pretty=format:'%s' | grep -vE '^(Merge (pull request|branch)|chore\(release\): v)' || true)
          else
            LOG=$(git log -50 HEAD --no-merges --pretty=format:'%s' | grep -vE '^(Merge (pull request|branch)|chore\(release\): v)' || true)
          fi
          {
            echo "# ColdFront v${VERSION}"
            echo
            echo "> 本 APK 已使用 ColdFront 发布密钥签名，安装时需在系统设置中允许「未知来源」。"
            echo
            echo "## ✨ 新功能"
            echo "$LOG" | grep -E '^(feat|feature)(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "## 🐛 修复"
            echo "$LOG" | grep -E '^fix(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "## ⚙️ 改进与优化"
            echo "$LOG" | grep -E '^(refactor|perf)(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "## 📦 其他"
            echo "$LOG" | grep -vE '^(feat|feature|fix|refactor|perf)(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "完整协议文档见 docs/protocol-8pro.md。"
          } > "$NOTES"
          echo "===== 发布说明预览 ====="
          cat "$NOTES"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 纯 Kotlin 应用：无原生库，通用 APK 兼容所有 ABI，以应用名上传
          cp app/build/outputs/apk/release/app-release.apk ColdFront.apk
          gh release create "v${{ steps.resolve.outputs.version }}" \
            --title "ColdFront v${{ steps.resolve.outputs.version }}" \
            --notes-file "/tmp/coldfront-notes-${{ steps.resolve.outputs.version }}.md" \
            ColdFront.apk
          gh release view "v${{ steps.resolve.outputs.version }}"