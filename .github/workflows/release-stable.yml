name: Release Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版版本号，格式 X.Y.Z（留空则使用项目当前版本号，不升级）'
        required: false
        type: string
        default: ''

run-name: Release ${{ inputs.version != '' && format('v{0}', inputs.version) || 'current project version' }}

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  release:
    name: Build, tag and publish stable release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      # compileSdk 37 可能不在 runner 预装 SDK 里，先接受许可以便 AGP 自动补装
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolve and bump version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          CUR=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          INPUT="${{ inputs.version }}"
          if [ -z "$INPUT" ]; then
            echo "未输入版本号，使用项目当前版本 $CUR（不升级 versionName/versionCode）"
            VERSION="$CUR"
          else
            [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本号格式错误：$INPUT（需 X.Y.Z）"; exit 1; }
            # 新版本必须高于当前版本（sort -V 语义比较）
            if ! printf '%s\n%s\n' "$CUR" "$INPUT" | sort -V | tail -1 | grep -Fxq "$INPUT"; then
              echo "新版本 $INPUT 不高于当前 $CUR，拒绝发布"
              exit 1
            fi
            NEW_CODE=$((CODE + 1))
            sed -i "s/versionName = \".*\"/versionName = \"$INPUT\"/" app/build.gradle.kts
            sed -i "s/versionCode = [0-9]*/versionCode = $NEW_CODE/" app/build.gradle.kts
            VERSION="$INPUT"
            echo "已写入 versionName=$VERSION, versionCode=$NEW_CODE"
            git diff -- app/build.gradle.kts
          fi
          # tag 已存在则拒绝，避免重复发布同一版本
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} 已存在，拒绝重复发布"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile debug and release sources
        run: ./gradlew compileDebugKotlin compileReleaseKotlin --stacktrace

      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintRelease --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Commit version bump and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 有版本号改动才提交；未输入版本号时无改动，跳过提交
          if [ -n "$(git status --porcelain)" ]; then
            git add app/build.gradle.kts
            git commit -m "chore(release): v${VERSION}"
            echo "已提交版本号改动"
          else
            echo "无版本号改动，跳过提交"
          fi
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
          echo "已推送 tag v${VERSION}"

      - name: Generate Chinese release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          NOTES="/tmp/coldfront-notes-${VERSION}.md"
          # 上一个正式版 tag（不含本次刚打的 tag）；首个正式版时为空
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV"..HEAD --no-merges --pretty=format:'%s' | grep -vE '^(Merge (pull request|branch)|chore\(release\): v)' || true)
          else
            LOG=$(git log -50 HEAD --no-merges --pretty=format:'%s' | grep -vE '^(Merge (pull request|branch)|chore\(release\): v)' || true)
          fi
          {
            echo "# ColdFront v${VERSION}"
            echo
            echo "> 本 APK 为未签名版本，安装需在系统设置中允许「未知来源」。"
            echo
            echo "## ✨ 新功能"
            echo "$LOG" | grep -E '^(feat|feature)(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "## 🐛 修复"
            echo "$LOG" | grep -E '^fix(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "## ⚙️ 改进与优化"
            echo "$LOG" | grep -E '^(refactor|perf)(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "## 📦 其他"
            echo "$LOG" | grep -vE '^(feat|feature|fix|refactor|perf)(\(|:)' | sed 's/^/ - /' || true
            echo
            echo "完整协议文档见 docs/protocol-8pro.md。"
          } > "$NOTES"
          echo "===== 发布说明预览 ====="
          cat "$NOTES"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 纯 Kotlin 应用：无原生库，通用 APK 兼容所有 ABI，以应用名上传
          cp app/build/outputs/apk/release/app-release-unsigned.apk ColdFront.apk
          gh release create "v${{ steps.resolve.outputs.version }}" \
            --title "ColdFront v${{ steps.resolve.outputs.version }}" \
            --notes-file "/tmp/coldfront-notes-${{ steps.resolve.outputs.version }}.md" \
            ColdFront.apk
          gh release view "v${{ steps.resolve.outputs.version }}"
